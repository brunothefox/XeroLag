<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>XeroLag Setup</title><link rel="stylesheet" href="setup.css"></head>
<body><svg class="symbols" xmlns="http://www.w3.org/2000/svg"><symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v12H3Z"/></symbol><symbol id="shield" viewBox="0 0 24 24"><path d="m12 3 8 4v5c0 5-8 9-8 9s-8-4-8-9V7Z"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="bolt" viewBox="0 0 24 24"><path d="m14 2-9 12h7l-2 8 9-12h-7Z"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="clean" viewBox="0 0 24 24"><path d="m14 3 3 3-7 8-4-4Zm-8 7-3 8 8 3 3-7M7 15l-2 5"/></symbol></svg>
<main class="shell"><div class="window-drag"></div><div class="window-controls"><button id="minimize" aria-label="Minimize"><svg><use href="#minus"/></svg></button><button id="close" aria-label="Close setup"><svg><use href="#close"/></svg></button></div>
<aside class="brand"><div class="brand-art"><img src="../../assets/branding/xerolag.png" alt="XeroLag" draggable="false"></div><div class="brand-tools"><span><svg><use href="#clean"/></svg>Clean</span><span><svg><use href="#bolt"/></svg>Tune</span><span><svg><use href="#shield"/></svg>Recover</span></div><span class="brand-line"></span></aside>
<section class="content" aria-labelledby="title"><div class="content-main"><h1 id="title">Install XeroLag<span class="title-dot">.</span></h1><p class="intro" id="intro">A fresh start for your next session.</p>
<div id="choices"><div class="location"><label>Install location</label><div class="location-control"><svg><use href="#folder"/></svg><span id="directory">Reading setup…</span><button id="browse">Change</button></div></div><label class="shortcut"><input type="checkbox" id="desktop" checked><span>Create a desktop shortcut</span></label><p class="keep"><svg><use href="#shield"/></svg>Your recovery backups stay in place.</p></div>
<div id="progress" hidden role="status" aria-live="polite"><div class="progress-track"><span></span></div><ol class="steps"><li id="step-verify"><span class="step-icon"><svg><use href="#check"/></svg></span><span>Verify installer files</span><span class="step-status"></span></li><li id="step-install"><span class="step-icon"><svg><use href="#check"/></svg></span><span>Install application</span><span class="step-status"></span></li><li id="step-ready"><span class="step-icon"><svg><use href="#check"/></svg></span><span>Ready to launch</span><span class="step-status"></span></li></ol></div>
<div id="complete" hidden><div class="complete-mark"><svg><use href="#check"/></svg></div><p id="complete-message">XeroLag is installed. Your settings are yours to choose.</p></div><p id="error" class="error" role="alert" hidden></p></div>
<footer><button id="install" class="primary" disabled><span>Install XeroLag</span><svg><use href="#arrow"/></svg></button><button id="launch" class="primary" hidden><span>Open XeroLag</span><svg><use href="#arrow"/></svg></button><button id="done" class="done" hidden>Finish setup</button><div class="metadata"><span id="size">Preparing setup</span><span id="version"></span></div></footer></section></main><script src="setup.js"></script></body></html>
